name: Cloud Media Downloader (yt-dlp & pytubefix)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video or Post URL (YouTube, Instagram, TikTok, Twitter, etc.)'
        required: true
        type: string
      format:
        description: 'Output format'
        required: true
        default: 'video-720p'
        type: choice
        options:
          - 'video-best'
          - 'video-1080p'
          - 'video-720p'
          - 'audio-mp3'
      send_to_telegram:
        description: 'Send downloaded file to Telegram channel/bot (requires secrets)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    name: Download and Deliver Media
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for yt-dlp & PO-Token Generator
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Bgutil PO-Token Provider Docker
        run: |
          echo "Starting brainicism/bgutil-ytdlp-pot-provider container..."
          docker run --name bgutil-provider -d --init -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4416/ping > /dev/null; then
              echo "POT Provider is ready on port 4416!"
              curl -s http://127.0.0.1:4416/ping
              break
            fi
            sleep 1
          done

      - name: Setup Cloudflare WARP via Wireproxy
        run: |
          echo "Downloading wgcf and wireproxy..."
          sudo curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o /usr/local/bin/wgcf
          sudo chmod +x /usr/local/bin/wgcf
          sudo curl -fsSL https://github.com/whyvl/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin/
          sudo chmod +x /usr/local/bin/wireproxy

          echo "Registering WARP and generating profile..."
          wgcf register --accept-tos
          wgcf generate

          # Force IPv4 anycast endpoint to avoid IPv6 routing issues on CI
          sed -i 's/engage.cloudflareclient.com/162.159.192.1/g' wgcf-profile.conf

          cat << 'EOF' > wireproxy.conf
          WGConfig = ./wgcf-profile.conf

          [Socks5]
          BindAddress = 127.0.0.1:1080

          [HTTP]
          BindAddress = 127.0.0.1:8080
          EOF

          echo "Starting wireproxy in background as sudo nohup..."
          sudo nohup /usr/local/bin/wireproxy -c wireproxy.conf > /tmp/wireproxy.log 2>&1 &
          
          echo "Waiting for Cloudflare WARP tunnel..."
          for i in {1..20}; do
            if curl -s --proxy http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "Cloudflare WARP proxy is UP and VERIFIED!"
              curl -s --proxy http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace
              break
            fi
            echo "Waiting for proxy ($i)..."
            cat /tmp/wireproxy.log 2>/dev/null || true
            sleep 1
          done

      - name: Install dependencies (yt-dlp, curl_cffi, pytubefix, and ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default,curl-cffi]" gallery-dl requests bgutil-ytdlp-pot-provider pytubefix

      - name: Download Media Engine
        id: dl
        env:
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          python scripts/download.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.format }}"

      - name: Send to Telegram (Optional)
        if: ${{ github.event.inputs.send_to_telegram == 'true' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not configured. Skipping Telegram upload."
            exit 0
          fi

          FILENAME="${{ steps.dl.outputs.filename }}"
          FILEPATH="${{ steps.dl.outputs.filepath }}"
          FILESIZE="${{ steps.dl.outputs.filesize }}"
          DIRECT_URL="${{ steps.dl.outputs.direct_url }}"

          if [ -n "$FILEPATH" ] && [ -f "$FILEPATH" ]; then
            if [ "$FILESIZE" -le 49000000 ]; then
              echo "Sending file directly to Telegram..."
              curl -s -F chat_id="$TG_CHAT_ID" \
                   -F document=@"$FILEPATH" \
                   -F caption="🎬 $FILENAME"$'\n\n'"📡 @OneForAllHub" \
                   "https://api.telegram.org/bot$TG_BOT_TOKEN/sendDocument"
            else
              echo "File is larger than 50MB. Sending direct download link to Telegram..."
              MSG="🎬 <b>فایل آماده دانلود شد!</b>"$'\n\n'"📁 نام: $FILENAME"$'\n'"🔗 <a href='$DIRECT_URL'>دانلود مستقیم پرسرعت</a>"$'\n\n'"📡 @OneForAllHub"
              curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                   --data-urlencode chat_id="$TG_CHAT_ID" \
                   --data-urlencode parse_mode="HTML" \
                   --data-urlencode text="$MSG"
            fi
          fi

      - name: Save Artifact on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-media
          path: output/*
          retention-days: 3
