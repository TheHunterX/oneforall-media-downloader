name: Cloud Media Downloader (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video or Post URL (YouTube, Instagram, TikTok, Twitter, etc.)'
        required: true
        type: string
      format:
        description: 'Output format'
        required: true
        default: 'video-720p'
        type: choice
        options:
          - 'video-best'
          - 'video-1080p'
          - 'video-720p'
          - 'audio-mp3'
      send_to_telegram:
        description: 'Send downloaded file to Telegram channel/bot (requires secrets)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    name: Download and Deliver Media
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for yt-dlp JavaScript runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (yt-dlp with curl_cffi and ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" gallery-dl requests

      - name: Download Media Engine
        id: dl
        run: |
          python scripts/download.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.format }}"

      - name: Send to Telegram (Optional)
        if: ${{ github.event.inputs.send_to_telegram == 'true' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not configured. Skipping Telegram upload."
            exit 0
          fi

          FILENAME="${{ steps.dl.outputs.filename }}"
          FILEPATH="${{ steps.dl.outputs.filepath }}"
          FILESIZE="${{ steps.dl.outputs.filesize }}"
          DIRECT_URL="${{ steps.dl.outputs.direct_url }}"

          if [ -n "$FILEPATH" ] && [ -f "$FILEPATH" ]; then
            if [ "$FILESIZE" -le 49000000 ]; then
              echo "Sending file directly to Telegram..."
              curl -F chat_id="$TG_CHAT_ID" \
                   -F document=@"$FILEPATH" \
                   -F caption="🎬 $FILENAME%0A%0A📡 @OneForAllHub" \
                   "https://api.telegram.org/bot$TG_BOT_TOKEN/sendDocument"
            else
              echo "File is larger than 50MB. Sending download link to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                   -d chat_id="$TG_CHAT_ID" \
                   -d parse_mode="HTML" \
                   -d text="🎬 <b>فایل آماده دانلود شد!</b>%0A%0A📁 نام فایل: $FILENAME%0A🔗 <a href='$DIRECT_URL'>دانلود مستقیم پرسرعت</a>%0A%0A📡 @OneForAllHub"
            fi
          fi

      - name: Save Artifact on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-media
          path: output/*
          retention-days: 3
